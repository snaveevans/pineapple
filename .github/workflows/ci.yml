name: CI

# Runs on every PR and on pushes to main. These are the checks you can require
# before a PR can be merged — so merging from your phone stays safe.
on:
  pull_request:
    # Default types omit `labeled`/`unlabeled` — without them, applying the
    # breaking-api escape-hatch label to an already-red PR wouldn't retrigger
    # this workflow, leaving the gate stuck red until a new commit or manual
    # re-run (issue #118 review).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Overrides the workflow-level permissions above (job-level replaces,
    # it does not add). `issues: write` is only needed to idempotently
    # create the `breaking-api` escape-hatch label (issue #118).
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm -r test

      # /migrations has no other coverage. Applying every migration in order to a
      # fresh D1 catches ordering bugs and bad SQL on the PR, before deploy.yml
      # applies the same files --remote against production (issue #119).
      #
      # These three steps run unconditionally rather than path-scoped like the
      # mutation gate or the OpenAPI breaking-change gate below: measured cost is
      # ~13-20s combined (spike results on issue #119), which is what keeps
      # `verify` inside its ~2-minute budget even on every PR. Scoping only pays
      # off once a gate's own cost — not the fixed pnpm/checkout setup shared by
      # the whole job — is what's driving `verify` over budget; a path filter here
      # would add a script and a drift risk (the filter's path list silently
      # diverging from what actually affects the D1 schema) to save single-digit
      # seconds on PRs that don't touch migrations. Revisit if migration count
      # growth pushes the apply step's cost materially higher.
      - name: Apply migrations to a fresh D1
        run: .github/scripts/migrations-fresh-apply.sh

      # Separate check, not redundant with the apply above: a fresh D1 is empty,
      # and SQLite only rejects `ADD COLUMN ... NOT NULL` without a default on a
      # populated table. Only a static scan can catch it (issue #119).
      - name: Scan migrations for destructive DDL
        run: .github/scripts/migration-ddl-scan.sh

      - name: Migration DDL scan selftest
        run: .github/scripts/migration-ddl-scan.selftest.sh

      # Gate-logic selftest for the mutation path filter (ADR-0016). Cheap; runs
      # on every PR so a regex typo cannot silently widen/narrow the trust boundary.
      - name: Mutation scope selftest
        run: .github/scripts/mutation-scope.selftest.sh

      # The committed OpenAPI spec must match what the code generates, so the
      # static file (read by codebase tools) never drifts from the live API.
      - name: Check OpenAPI spec is up to date
        run: |
          pnpm --filter @snaveevans/pineapple-api openapi:generate
          git diff --exit-code docs/reference/openapi.json

      # The committed Worker binding types must match wrangler.jsonc, so the
      # Env type can never drift from the declared bindings (issue #65).
      - name: Check generated Worker types are up to date
        run: |
          pnpm --filter @snaveevans/pineapple-api cf-typegen
          git diff --exit-code apps/api/worker-configuration.d.ts

      # The web client's types are generated from the committed spec, so an API
      # contract change breaks `type-check` in apps/web instead of the browser
      # (issue #117). Stale generated types would reopen that gap.
      - name: Check generated web API types are up to date
        run: |
          pnpm --filter @snaveevans/pineapple-web api:types
          git diff --exit-code apps/web/src/api/schema.ts

      # Staleness (above) and backward-compatibility are different questions —
      # with required_approving_review_count 0 and auto-merge, a removed
      # response field, narrowed enum, or newly-required request field can
      # merge and deploy unseen (issue #118). `breaking-api` is the escape
      # hatch for a deliberate break; ensure it exists so it's always
      # available to apply, whether or not this run finds a breaking change.
      - name: Ensure breaking-api escape-hatch label exists
        if: github.event_name == 'pull_request'
        # GITHUB_TOKEN is forced read-only on fork-originated PRs regardless
        # of the job's requested permissions, so this write would 403 there.
        # It's best-effort housekeeping, not the gate itself — don't fail the
        # whole job over it (issue #118 review).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create breaking-api \
            --color D93F0B \
            --description "Deliberately allows a backward-incompatible OpenAPI change past the breaking-change gate" \
            --force >/dev/null

      # Skip the gate when the spec is untouched, so it stays off the hot
      # path. Fails closed: if the base ref can't be fetched, run the gate
      # rather than silently skip it.
      - name: Check whether OpenAPI spec changed vs base branch
        id: openapi-spec-diff
        if: github.event_name == 'pull_request'
        run: |
          set -uo pipefail
          if ! git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"; then
            echo "::warning::Could not fetch base ref $GITHUB_BASE_REF — running breaking-change gate to fail closed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "origin/$GITHUB_BASE_REF" -- docs/reference/openapi.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: OpenAPI breaking-change gate
        if: >-
          github.event_name == 'pull_request' &&
          steps.openapi-spec-diff.outputs.changed == 'true' &&
          !contains(github.event.pull_request.labels.*.name, 'breaking-api')
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: "origin/${{ github.base_ref }}:docs/reference/openapi.json"
          revision: docs/reference/openapi.json
          fail-on: ERR
          # No spec leaves CI, and no PR-comment token/permission is needed:
          # breaking changes still fail the job with inline ::error::
          # annotations on the Files changed tab and in the job log.
          review: false
          github-token: ""
