name: CI

# Runs on every PR and on pushes to main. These are the checks you can require
# before a PR can be merged — so merging from your phone stays safe.
on:
  pull_request:
    # Default types omit `labeled`/`unlabeled` — without them, applying the
    # breaking-api escape-hatch label to an already-red PR wouldn't retrigger
    # this workflow, leaving the gate stuck red until a new commit or manual
    # re-run (issue #118 review).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Overrides the workflow-level permissions above (job-level replaces,
    # it does not add). `issues: write` is only needed to idempotently
    # create the `breaking-api` escape-hatch label (issue #118).
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm -r test

      # Gate-logic selftest for the mutation path filter (ADR-0016). Cheap; runs
      # on every PR so a regex typo cannot silently widen/narrow the trust boundary.
      - name: Mutation scope selftest
        run: .github/scripts/mutation-scope.selftest.sh

      # The committed OpenAPI spec must match what the code generates, so the
      # static file (read by codebase tools) never drifts from the live API.
      - name: Check OpenAPI spec is up to date
        run: |
          pnpm --filter @snaveevans/pineapple-api openapi:generate
          git diff --exit-code docs/reference/openapi.json

      # The committed Worker binding types must match wrangler.jsonc, so the
      # Env type can never drift from the declared bindings (issue #65).
      - name: Check generated Worker types are up to date
        run: |
          pnpm --filter @snaveevans/pineapple-api cf-typegen
          git diff --exit-code apps/api/worker-configuration.d.ts

      # The web client's types are generated from the committed spec, so an API
      # contract change breaks `type-check` in apps/web instead of the browser
      # (issue #117). Stale generated types would reopen that gap.
      - name: Check generated web API types are up to date
        run: |
          pnpm --filter @snaveevans/pineapple-web api:types
          git diff --exit-code apps/web/src/api/schema.ts

      # Staleness (above) and backward-compatibility are different questions —
      # with required_approving_review_count 0 and auto-merge, a removed
      # response field, narrowed enum, or newly-required request field can
      # merge and deploy unseen (issue #118). `breaking-api` is the escape
      # hatch for a deliberate break; ensure it exists so it's always
      # available to apply, whether or not this run finds a breaking change.
      - name: Ensure breaking-api escape-hatch label exists
        if: github.event_name == 'pull_request'
        # GITHUB_TOKEN is forced read-only on fork-originated PRs regardless
        # of the job's requested permissions, so this write would 403 there.
        # It's best-effort housekeeping, not the gate itself — don't fail the
        # whole job over it (issue #118 review).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create breaking-api \
            --color D93F0B \
            --description "Deliberately allows a backward-incompatible OpenAPI change past the breaking-change gate" \
            --force >/dev/null

      # Skip the gate when the spec is untouched, so it stays off the hot
      # path. Fails closed: if the base ref can't be fetched, run the gate
      # rather than silently skip it.
      - name: Check whether OpenAPI spec changed vs base branch
        id: openapi-spec-diff
        if: github.event_name == 'pull_request'
        run: |
          set -uo pipefail
          if ! git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"; then
            echo "::warning::Could not fetch base ref $GITHUB_BASE_REF — running breaking-change gate to fail closed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "origin/$GITHUB_BASE_REF" -- docs/reference/openapi.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: OpenAPI breaking-change gate
        if: >-
          github.event_name == 'pull_request' &&
          steps.openapi-spec-diff.outputs.changed == 'true' &&
          !contains(github.event.pull_request.labels.*.name, 'breaking-api')
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: "origin/${{ github.base_ref }}:docs/reference/openapi.json"
          revision: docs/reference/openapi.json
          fail-on: ERR
          # No spec leaves CI, and no PR-comment token/permission is needed:
          # breaking changes still fail the job with inline ::error::
          # annotations on the Files changed tab and in the job log.
          review: false
          github-token: ""

  # Web state gallery (#145) + visual diff against merge-base (#146).
  # Path-scoped so it stays off the hot path for non-web PRs.
  # PNGs are artifacts / R2 delta only — never committed.
  # Phase A (#146): findings are non-blocking; harness crashes still fail.
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Need full history for merge-base on PRs (visual diff #146).
          fetch-depth: 0

      - name: Check whether apps/web or gallery inputs changed
        id: gallery-scope
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "diff=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git fetch --no-tags origin "$GITHUB_BASE_REF"; then
            echo "::warning::Could not fetch base ref — running gallery to fail closed"
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "diff=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Shared build inputs can move pixels (lockfile bumps vite/react/etc.).
          # Mirrors deploy.yml's web filter + mutation-scope's lockfile rule.
          if git diff --quiet "origin/$GITHUB_BASE_REF" -- \
            apps/web \
            docs/web \
            docs/specs/cross-cutting/testing.md \
            .github/workflows/ci.yml \
            .github/scripts/ensure-visual-diff-r2.sh \
            .github/scripts/upload-visual-diff-r2.sh \
            .github/scripts/post-visual-diff-comment.sh \
            pnpm-lock.yaml \
            package.json \
            pnpm-workspace.yaml \
            tsconfig.base.json \
            tsconfig.json \
            packages/shared
          then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "diff=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "diff=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        if: steps.gallery-scope.outputs.run == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node
        if: steps.gallery-scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (HEAD)
        if: steps.gallery-scope.outputs.run == 'true'
        env:
          # Chromium is installed in a later step; do not let the postinstall refetch.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: steps.gallery-scope.outputs.run == 'true'
        run: pnpm --filter @snaveevans/pineapple-web exec playwright install chromium --with-deps

      # Build+render is shared with local usage via scripts/gallery-build-render.sh
      # (scripts/gallery-diff-local.sh, docs/specs/cross-cutting/testing.md).
      - name: Build and render state gallery (HEAD)
        if: steps.gallery-scope.outputs.run == 'true'
        run: bash scripts/gallery-build-render.sh apps/web/gallery/out-head

      # Dual render + pixel diff only on pull_request (Phase A of #146).
      # Worktree mechanics are shared with local usage via
      # scripts/gallery-render-at-ref.sh — see that script's header and
      # scripts/gallery-diff-local.sh, which renders the same merge-base
      # baseline (cached) before a push.
      - name: Render state gallery (merge-base)
        if: steps.gallery-scope.outputs.run == 'true' && steps.gallery-scope.outputs.diff == 'true'
        id: base-render
        run: |
          set -euo pipefail
          MERGE_BASE="$(git merge-base HEAD "origin/${GITHUB_BASE_REF}")"
          echo "merge_base=${MERGE_BASE}" >> "$GITHUB_OUTPUT"
          echo "Rendering gallery at merge-base ${MERGE_BASE}"
          bash scripts/gallery-render-at-ref.sh \
            "$MERGE_BASE" \
            "${GITHUB_WORKSPACE}/apps/web/gallery/out-base" \
            "${RUNNER_TEMP}/gallery-merge-base"

      - name: Pixel-diff gallery (merge-base vs HEAD)
        if: steps.gallery-scope.outputs.run == 'true' && steps.gallery-scope.outputs.diff == 'true'
        id: gallery-diff
        run: |
          set -euo pipefail
          pnpm --filter @snaveevans/pineapple-web gallery:diff -- \
            --base apps/web/gallery/out-base \
            --head apps/web/gallery/out-head \
            --out apps/web/gallery/out-diff
          # Phase A never fails on delta; expose the count for R2/comment steps.
          delta="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const s = JSON.parse(readFileSync("apps/web/gallery/out-diff/summary.json","utf8")); process.stdout.write(String(s.changedCount+s.addedCount+s.removedCount+s.resizedCount));')"
          echo "delta=${delta}" >> "$GITHUB_OUTPUT"
          echo "Visual delta: ${delta}"

      # Gallery PNGs are gitignored under out*/; that is the primary protection.
      # Also fail if any gallery PNG is tracked in git (force-add / wrong path).
      - name: Assert no gallery PNGs are tracked
        if: steps.gallery-scope.outputs.run == 'true'
        run: |
          tracked="$(git ls-files 'apps/web/gallery/**/*.png' 'apps/web/gallery/out/**' 'apps/web/gallery/out-*/**' || true)"
          if [ -n "$tracked" ]; then
            echo "Gallery PNGs must not be committed:"
            printf '%s\n' "$tracked"
            exit 1
          fi

      - name: Upload HEAD gallery artifact
        if: steps.gallery-scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: web-state-gallery
          path: apps/web/gallery/out-head
          retention-days: 7
          if-no-files-found: error

      - name: Upload visual-diff artifact
        if: steps.gallery-scope.outputs.run == 'true' && steps.gallery-scope.outputs.diff == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: web-visual-diff
          path: apps/web/gallery/out-diff
          retention-days: 7
          if-no-files-found: error

      # Host only the delta on R2 so the PR comment is phone-reviewable (#146).
      # Fork PRs have no secrets — degrade to artifact-only and never fail.
      - name: Host delta on R2 and build PR comment
        id: r2-upload
        if: >-
          steps.gallery-scope.outputs.run == 'true'
          && steps.gallery-scope.outputs.diff == 'true'
          && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          DELTA="${{ steps.gallery-diff.outputs.delta }}"
          COMMENT_ARGS=(
            --summary apps/web/gallery/out-diff/summary.json
            --out apps/web/gallery/out-diff/comment.md
            --head-sha "$HEAD_SHA"
            --pr "$PR_NUMBER"
          )

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "No Cloudflare secrets (fork PR or unset) — artifact-only mode."
            echo "hosted=false" >> "$GITHUB_OUTPUT"
            node --experimental-strip-types apps/web/gallery/report-comment.ts \
              "${COMMENT_ARGS[@]}" --artifact-only
            exit 0
          fi

          if [ "$DELTA" = "0" ]; then
            echo "Zero visual change — nothing to upload."
            echo "hosted=true" >> "$GITHUB_OUTPUT"
            echo "uploaded=0" >> "$GITHUB_OUTPUT"
            node --experimental-strip-types apps/web/gallery/report-comment.ts \
              "${COMMENT_ARGS[@]}"
            exit 0
          fi

          chmod +x .github/scripts/ensure-visual-diff-r2.sh \
            .github/scripts/upload-visual-diff-r2.sh

          ensure_out="$(.github/scripts/ensure-visual-diff-r2.sh | tee /dev/stderr)"
          PUBLIC_BASE="$(grep -E '^public_base_url=' <<<"$ensure_out" | tail -n1 | cut -d= -f2-)"
          if [ -z "$PUBLIC_BASE" ]; then
            echo "::error::Could not resolve r2.dev public base URL"
            exit 1
          fi

          PREFIX="pr/${PR_NUMBER}/${HEAD_SHA}"
          VISUAL_DIFF_PREFIX="$PREFIX" \
            VISUAL_DIFF_DIR="apps/web/gallery/out-diff" \
            .github/scripts/upload-visual-diff-r2.sh

          IMAGE_BASE="${PUBLIC_BASE}/${PREFIX}"
          echo "hosted=true" >> "$GITHUB_OUTPUT"
          echo "image_base_url=${IMAGE_BASE}" >> "$GITHUB_OUTPUT"

          node --experimental-strip-types apps/web/gallery/report-comment.ts \
            "${COMMENT_ARGS[@]}" --image-base-url "$IMAGE_BASE"

      - name: Post visual-diff PR comment
        if: >-
          steps.gallery-scope.outputs.run == 'true'
          && steps.gallery-scope.outputs.diff == 'true'
          && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY_FILE: apps/web/gallery/out-diff/comment.md
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ ! -f "$COMMENT_BODY_FILE" ]; then
            # R2 step failed before writing — fall back to a minimal artifact-only body.
            node --experimental-strip-types apps/web/gallery/report-comment.ts \
              --summary apps/web/gallery/out-diff/summary.json \
              --out "$COMMENT_BODY_FILE" \
              --head-sha "${{ github.event.pull_request.head.sha }}" \
              --pr "${{ github.event.pull_request.number }}" \
              --artifact-only
          fi
          chmod +x .github/scripts/post-visual-diff-comment.sh
          .github/scripts/post-visual-diff-comment.sh

      - name: Gallery skipped (no web paths touched)
        if: steps.gallery-scope.outputs.run != 'true'
        run: echo "No apps/web, docs/web, shared, or gallery-contract changes — gallery job no-op."
