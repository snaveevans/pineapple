name: Browser E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test path scope
        run: .github/scripts/e2e-scope.selftest.sh

      - name: Decide whether to run
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            .github/scripts/e2e-decide.sh always >> "$GITHUB_OUTPUT"
          else
            .github/scripts/e2e-decide.sh pr \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @snaveevans/pineapple-web exec playwright install --with-deps chromium

      - name: Run critical browser journeys
        if: steps.scope.outputs.run == 'true'
        run: pnpm test:e2e

      - name: Upload browser failure artifacts
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 14
