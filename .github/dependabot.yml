# Automated dependency updates (issue #125).
#
# The npm block covers the whole pnpm workspace from the root: dependabot-core's
# npm file fetcher reads `pnpm-workspace.yaml` and pulls in the `apps/*` and
# `packages/*` manifests alongside the single root `pnpm-lock.yaml`. Do not add
# per-package blocks — they would contend over that one lockfile.
#
# NOTE: this file configures *version* updates only. Dependabot **security**
# updates run on a separate job path driven by the GitHub Advisory Database and
# ignore this config entirely — including the cooldowns below, so a security
# patch is never held back. They are switched on in Settings > Code security,
# not here; that toggle is what makes advisories like #84 and #85 surface as
# PRs instead of being found by the periodic audit.
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

    # `pnpm-lock.yaml` is in the mutation gate's scope
    # (`.github/scripts/mutation-scope.sh`), so *every* PR from this block
    # triggers a full Stryker run against a 30-minute timeout. This limit is a
    # cost control, not a formality.
    open-pull-requests-limit: 5

    # Let a release sit in public long enough for the wider ecosystem to find a
    # bad one before it reaches us — broken publishes and compromised packages
    # are typically yanked within hours to days. This is the risk filter that
    # makes merging a green dependency PR a glance rather than an audit.
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3

    # Auto-merge every green PR from this block — dev and production alike.
    # The full CI gate (lint, type-check, tests, mutation, OpenAPI drift,
    # breaking-change gate) runs on every PR, so a green run is the signal
    # that a bump is safe to merge. Holding green dependency PRs for manual
    # review mostly produces staleness, not scrutiny (issue #125). Cooldowns
    # above are the real risk filter; auto-merge is just the last mile so a
    # green PR doesn't sit waiting for a button press.
    # Prerequisites: repo-level "Allow auto-merge" is enabled (Settings >
    # General > Pull Requests), and branch protection requires `verify` +
    # `mutation` with 0 approving reviews — auto-merge fires only after all
    # required checks pass.
    auto-merge: true

    groups:
      # react-dom asserts at runtime that its version exactly matches react's.
      # Left ungrouped, a version-locked pair can split across two PRs that
      # each pin the other stale in pnpm-lock.yaml (#153) — neither goes green
      # alone. This group must stay ahead of dev-non-major: Dependabot assigns
      # a dependency to the first matching group, so if these patterns are
      # ever widened to catch dev-type packages (e.g. @types/*), declaring
      # this group later would let dev-non-major claim them first.
      react:
        patterns:
          - "react"
          - "react-dom"

      # @hono/zod-openapi's peer dependency on zod moves in lockstep with its
      # own major version (v0.x -> zod v3, v1.x -> zod v4). Left ungrouped, a
      # bump on either side can land as two PRs that can't both go green
      # (#158, #155) — bumping zod alone crashed openapi:generate and broke
      # Worker boot; bumping @hono/zod-openapi alone failed tests against the
      # v3 objects still in the tree. Must stay ahead of dev-non-major for the
      # same first-match ordering reason as react above.
      zod-openapi:
        patterns:
          - "zod"
          - "@hono/zod-openapi"

      # One weekly PR for low-risk dev churn (eslint, prettier, vitest, wrangler,
      # stryker, @types/*). Majors are deliberately excluded so a breaking
      # toolchain bump lands in its own reviewable PR.
      dev-non-major:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

    # Production dependencies (hono, better-auth, react-router, ...) are
    # intentionally left ungrouped: each gets its own PR, so a red CI run
    # points at exactly one package. react/react-dom and zod/@hono/zod-openapi
    # are the version-locked exceptions, grouped above.

    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"

  # Action pins in .github/workflows/*. These never touch `pnpm-lock.yaml`, so
  # they cost no mutation run — group them all into a single PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Same reasoning as the npm block above: the CI gate is the safety net,
    # and these PRs don't even trigger the mutation run (no pnpm-lock.yaml
    # change), so holding them for manual review is pure staleness.
    auto-merge: true
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
